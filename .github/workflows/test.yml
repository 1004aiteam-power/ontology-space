# push · pull request마다 테스트를 돌리고, 메뉴·head 태그(tools/build_nav.py)가 최신인지 확인하고, 모든 페이지를 브라우저로 열어 본다
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      # 프로그래밍 언어 페이지의 R 예제 · 시연을 진짜 R 로 대조 (gcc · g++ · javac · rustc 는 러너에 이미 있음)
      - name: Install R
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends r-base-core
      - name: Python tests
        run: python -m pytest -q tests
      - name: Node tests
        run: |
          for t in tests/*.test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done
      - name: Menus and head tags are up to date
        run: |
          python tools/build_nav.py
          git diff --exit-code || { echo "::error::tools/build_nav.py 를 실행한 결과를 커밋하세요"; exit 1; }

  # 모든 페이지를 실제 브라우저로 열어 스크립트 오류 · 가로 밀림 · 불러오지 못한 파일을 확인
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Open every page in a browser
        run: node tools/check_pages.cjs
